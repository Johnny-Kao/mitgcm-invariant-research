name: Core ocean restart equivalence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran
      - run: bash research/core_restart.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-restart
          path: |
            research/core-results/**/*.log
            research/core-results/**/*.json
          retention-days: 7
