name: MIT-09 native tracer experiment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Native build and controlled comparison
        run: bash research/mit09_native.sh
      - name: Preserve logs and binary outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mit09-native
          path: research/results/
          retention-days: 7
